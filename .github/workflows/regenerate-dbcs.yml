name: Regenerate T26 DBC outputs with Codex

on:
  workflow_dispatch:
    inputs:
      dbc_ref:
        description: T26_DBC branch, tag, or commit to import
        default: main
        type: string
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dbc-regeneration
  cancel-in-progress: false

jobs:
  sync-dbc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      destination_sha: ${{ steps.baseline.outputs.destination_sha }}
      interface_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Checkout DBC source
        uses: actions/checkout@v4
        with:
          repository: FSLART/T26_DBC
          ref: ${{ inputs.dbc_ref || 'main' }}
          path: build/dbc-source
          persist-credentials: false

      - name: Use current interface baseline
        id: baseline
        run: |
          git -C src/lart_msgs fetch origin main
          git -C src/lart_msgs checkout --detach origin/main
          echo "sha=$(git -C src/lart_msgs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "destination_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Regenerate DBC outputs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-can python3-tk acl
          python3 -m venv --system-site-packages "$RUNNER_TEMP/dbc-venv"
          "$RUNNER_TEMP/dbc-venv/bin/pip" install -r scripts/requirements-dbc.txt
          "$RUNNER_TEMP/dbc-venv/bin/python" scripts/regenerate_dbcs.py --source-dir build/dbc-source

      - name: Check generated changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Avoid paying for the same scheduled adaptation while its PR is open.
          # Manual dispatch deliberately bypasses this check for retries.
          if [ "$EVENT_NAME" = schedule ]; then
            pending_sha=$(gh pr list --head automation/dbc-regeneration --state open --json headRefOid --jq '.[0].headRefOid // empty')
            if [ -n "$pending_sha" ]; then
              git fetch --no-tags origin "$pending_sha"
              if git show FETCH_HEAD:dbc_signals/source.json > "$RUNNER_TEMP/pending-dbc-source.json" && cmp -s dbc_signals/source.json "$RUNNER_TEMP/pending-dbc-source.json"; then
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "This DBC revision already has an open update PR."
                exit 0
              fi
            fi
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- dbc_signals LART_Car_Dashboard_v1/src/ui src/lart_msgs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Codex credential
        if: steps.changes.outputs.changed == 'true'
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Add the OPENAI_API_KEY Actions secret to this repository."
            exit 1
          fi

      # Install everything before Codex irreversibly drops sudo privileges.
      - name: Set up ROS2 build
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-arm64

      - name: Adapt DBC consumers with Codex
        if: steps.changes.outputs.changed == 'true'
        uses: openai/codex-action@v1
        timeout-minutes: 25
        env:
          DBC_PYTHON: ${{ runner.temp }}/dbc-venv/bin/python
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .github/codex/dbc-update.md
          output-file: ${{ runner.temp }}/dbc-codex-result.json
          output-schema: |
            {"type":"object","properties":{"ready":{"type":"boolean"},"summary":{"type":"string"}},"required":["ready","summary"],"additionalProperties":false}

      - name: Require completed adaptation
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dbc-codex-result.json').read_text())
          print(result['summary'])
          if result['ready'] is not True:
              raise SystemExit('Codex requires human input; no PRs will be published.')
          PY

      - name: Test DBC outputs
        if: steps.changes.outputs.changed == 'true'
        run: |
          "$RUNNER_TEMP/dbc-venv/bin/python" -m pytest -q tests
          git diff --check
          git -C src/lart_msgs diff --check

      - name: Build ROS2 workspace
        if: steps.changes.outputs.changed == 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --parallel-workers 2

      - name: Build dashboard UI
        if: steps.changes.outputs.changed == 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cmake -S LART_Car_Dashboard_v1/src/ui -B LART_Car_Dashboard_v1/build/ui-build -DCMAKE_BUILD_TYPE=Release
          cmake --build LART_Car_Dashboard_v1/build/ui-build --target ui_runner can_bridge --parallel 2

      - name: Test handwritten DBC consumers
        if: steps.changes.outputs.changed == 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export PYTHONPATH="$GITHUB_WORKSPACE/src/sim:$GITHUB_WORKSPACE/src/lart_bringup:$GITHUB_WORKSPACE/src/led_controller${PYTHONPATH:+:$PYTHONPATH}"
          "$RUNNER_TEMP/dbc-venv/bin/python" -m pytest -q \
            src/sim/test/test_admin_controls.py src/sim/test/test_fault_tests.py \
            src/sim/test/test_simulation_config.py src/sim/test/test_admin_panel.py \
            src/lart_bringup/test/test_dbc_topic_names.py
          "$RUNNER_TEMP/dbc-venv/bin/python" -c 'import sim.can_simulator, lart_bringup.can_bridge, led_controller.led_node'

      - name: Package tested changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Only application changes cross into the credentialed publication job.
          for name in data_t26 powertrain_t26 autonomous_t26; do
            cmp "dbc_signals/$name.dbc" "build/dbc-source/$name.dbc"
          done
          git -C build/dbc-source diff --exit-code HEAD -- '*.dbc'
          while IFS= read -r file; do
            case "$file" in
              dbc_signals/*|LART_Car_Dashboard_v1/src/ui/*|src/lart_bringup/*|src/sim/*|src/led_controller/*|src/input_handler/*|src/lart_msgs|foxglove_extensions/*|tests/*|scripts/*|docs/*) ;;
              *) echo "::error::Unexpected changed path: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD; git ls-files --others --exclude-standard)
          test -z "$(git -C LART_Car_Dashboard_v1/src/ui/third_party/lvgl status --porcelain)"
          git diff --exit-code HEAD -- LART_Car_Dashboard_v1/src/ui/third_party
          git -C src/lart_msgs diff --exit-code HEAD -- .github .gitmodules
          while IFS= read -r file; do
            case "$file" in
              dbc_msgs/*|msg/*|srv/*|CMakeLists.txt|package.xml|README.md) ;;
              *) echo "::error::Unexpected interface path: $file"; exit 1 ;;
            esac
          done < <(git -C src/lart_msgs diff --name-only HEAD; git -C src/lart_msgs ls-files --others --exclude-standard)
          mkdir -p "$RUNNER_TEMP/dbc-update"
          git add --intent-to-add -- dbc_signals LART_Car_Dashboard_v1/src/ui src/lart_bringup src/sim src/led_controller src/input_handler foxglove_extensions tests scripts docs
          git diff --binary --no-ext-diff HEAD -- dbc_signals LART_Car_Dashboard_v1/src/ui src/lart_bringup src/sim src/led_controller src/input_handler foxglove_extensions tests scripts docs > "$RUNNER_TEMP/dbc-update/dashboard.patch"
          git -C src/lart_msgs add --intent-to-add -- dbc_msgs msg srv CMakeLists.txt package.xml README.md
          git -C src/lart_msgs diff --binary --no-ext-diff HEAD -- dbc_msgs msg srv CMakeLists.txt package.xml README.md > "$RUNNER_TEMP/dbc-update/interfaces.patch"
          cp "$RUNNER_TEMP/dbc-codex-result.json" "$RUNNER_TEMP/dbc-update/codex-result.json"

      - name: Upload tested changes
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tested-dbc-update
          path: ${{ runner.temp }}/dbc-update/
          if-no-files-found: error
          retention-days: 7

  # Fresh runner: Codex and builds never receive the publishing credential.
  publish:
    needs: sync-dbc
    if: needs.sync-dbc.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.DBC_SYNC_TOKEN }}
    steps:
      - name: Check publishing credential
        env:
          SYNC_TOKEN: ${{ secrets.DBC_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Add DBC_SYNC_TOKEN with write access to this repository and FSLART/lart_msgs."
            exit 1
          fi

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-dbc.outputs.destination_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout interface publication repository
        uses: actions/checkout@v4
        with:
          repository: FSLART/lart_msgs
          ref: ${{ needs.sync-dbc.outputs.interface_sha }}
          path: build/interface-publish
          persist-credentials: false

      - name: Download tested changes
        uses: actions/download-artifact@v4
        with:
          name: tested-dbc-update
          path: ${{ runner.temp }}/dbc-update

      - name: Apply tested changes
        run: |
          # Never silently rebase a tested snapshot onto a newer destination.
          git fetch origin master
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git -C build/interface-publish fetch origin main
          test "$(git -C build/interface-publish rev-parse FETCH_HEAD)" = "$(git -C build/interface-publish rev-parse HEAD)"
          if [ -s "$RUNNER_TEMP/dbc-update/dashboard.patch" ]; then
            git apply --index "$RUNNER_TEMP/dbc-update/dashboard.patch"
          fi
          if [ -s "$RUNNER_TEMP/dbc-update/interfaces.patch" ]; then
            git -C build/interface-publish apply --index "$RUNNER_TEMP/dbc-update/interfaces.patch"
          fi

      - name: Configure GitHub publication
        run: gh auth setup-git

      - name: Publish interface PR
        id: interfaces
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/interface-pr.md" <<EOF
            Generated interfaces and Codex adaptations passed tests, the ROS workspace build and dashboard/bridge builds.
            Source provenance is recorded in the linked data_station update's dbc_signals/source.json.
            Merge this interface PR first, preserving its commit (merge commit, not squash/rebase).
            Run details: $RUN_URL
          EOF
          bash .github/scripts/publish-dbc-pr.sh build/interface-publish FSLART/lart_msgs main \
            'Update T26 DBC interfaces with Codex' "$RUNNER_TEMP/interface-pr.md"

      - name: Pin published interfaces
        env:
          INTERFACE_SHA: ${{ steps.interfaces.outputs.sha }}
        run: |
          git -C src/lart_msgs fetch origin "$INTERFACE_SHA"
          git -C src/lart_msgs checkout --detach "$INTERFACE_SHA"
          test "$(git -C src/lart_msgs rev-parse HEAD)" = "$INTERFACE_SHA"
          git add src/lart_msgs

      - name: Publish dashboard PR
        env:
          DESTINATION_REPOSITORY: ${{ github.repository }}
          INTERFACE_PR: ${{ steps.interfaces.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/dashboard-pr.md" <<EOF
            Updates DBC inputs, C decoders, ROS interfaces, dashboard API, bridge and affected handwritten consumers.
            Codex reviewed the generated diff and adapted consumers/tests where needed.
            All root tests, the ROS workspace and dashboard/bridge builds passed before publication.
            The exact source commit, input hashes and cantools version are recorded in dbc_signals/source.json.

            Interface PR (merge first if present): $INTERFACE_PR
            Run details and Codex summary: $RUN_URL
            Review semantic/interface changes before merging. This workflow does not merge PRs or deploy.
          EOF
          bash .github/scripts/publish-dbc-pr.sh . "$DESTINATION_REPOSITORY" master \
            'Update T26 DBC code and consumers with Codex' "$RUNNER_TEMP/dashboard-pr.md"
