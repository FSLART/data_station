name: Validate runtime ARM64

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master, automate-dbc-regeneration]

permissions:
  contents: read

concurrency:
  group: dbc-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout frozen external ROS interfaces
        run: git submodule update --init src/lart_msgs

      - name: Set up ROS2 build
        uses: ./.github/actions/setup-arm64

      - name: Install runtime dependencies
        run: |
          sudo apt-get install -y ros-jazzy-rosbag2-storage-mcap libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxkbcommon-x11-0 fonts-dejavu-core
          python3 -m pip install --break-system-packages -r requirements-runtime.txt pytest PyYAML

      - name: Build runtime workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --packages-up-to data_station_runtime input_handler led_controller sim --parallel-workers 2

      - name: Test runtime contracts and DBC reload
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q src/data_station_runtime/test src/lart_bringup/test/test_trigger_state.py src/lart_bringup/test/test_bag_recorder.py tests/test_arm64_workflows.py tests/test_dbc_sync_workflow.py
          python3 -m data_station_runtime.app --demo --screenshot /tmp/dashboard.png
