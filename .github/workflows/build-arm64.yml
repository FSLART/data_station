name: Build ARM64

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ROS2 build
        uses: ./.github/actions/setup-arm64

      - name: Regenerate and test DBC outputs
        run: |
          python3 -m venv "$RUNNER_TEMP/dbc-venv"
          "$RUNNER_TEMP/dbc-venv/bin/pip" install -r scripts/requirements-dbc.txt
          "$RUNNER_TEMP/dbc-venv/bin/python" scripts/regenerate_dbcs.py
          "$RUNNER_TEMP/dbc-venv/bin/python" -m pytest -q tests/test_regenerate_dbcs.py tests/test_dbc_generation.py tests/test_dbc_api_abi.py tests/test_dbc_decoding.py tests/test_dbc_sync_workflow.py

      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            build
            install
            log
          key: colcon-arm64-${{ hashFiles('src/**/CMakeLists.txt', 'src/**/package.xml', 'src/**/*.cpp', 'src/**/*.hpp', 'src/**/*.h', 'src/**/*.py', 'src/**/*.msg', 'src/**/*.srv') }}
          restore-keys: |
            colcon-arm64-

      - name: Build ROS2 workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --parallel-workers $(nproc)

      - name: Build dashboard UI
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cmake -S LART_Car_Dashboard_v1/src/ui -B LART_Car_Dashboard_v1/build/ui-build -DCMAKE_BUILD_TYPE=Release
          cmake --build LART_Car_Dashboard_v1/build/ui-build --parallel $(nproc)

      - name: Package artifact
        run: tar czf lart-dashboard-arm64.tar.gz install LART_Car_Dashboard_v1/build/ui-build

      - name: Get short commit SHA
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ github.sha }}
          name: "ARM64 build ${{ steps.version.outputs.short_sha }}"
          files: lart-dashboard-arm64.tar.gz

      - name: Update latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-arm64
          name: "Latest ARM64 build"
          files: lart-dashboard-arm64.tar.gz
