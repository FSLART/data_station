name: Build ARM64

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-arm64-normal
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add ROS2 apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-arm64-jazzy-${{ hashFiles('.github/workflows/build-arm64.yml') }}

      - name: Install ROS2 and build tooling
        run: |
          sudo apt-get install -y \
            ros-jazzy-ros-base \
            ros-jazzy-rclcpp \
            ros-jazzy-rclpy \
            ros-jazzy-std-msgs \
            ros-jazzy-rosidl-default-generators \
            ros-jazzy-rosidl-default-runtime \
            python3-colcon-common-extensions \
            build-essential \
            cmake \
            ccache \
            pkg-config \
            libsdl2-dev
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Compute build cache keys
        id: cache-keys
        run: |
          toolchain=$(dpkg-query -W -f='${binary:Package}=${Version}\n' | sort | sha256sum | cut -d ' ' -f1)
          echo "prefix=arm64-jazzy-v2-${{ hashFiles('.github/workflows/build-arm64.yml') }}-${toolchain}" >> "$GITHUB_OUTPUT"
          echo "messages=$(git -C src/lart_msgs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Never restore a cache from different message definitions.
      - name: Cache lart_msgs
        id: messages-cache
        uses: actions/cache@v4
        with:
          path: |
            build/lart_msgs
            install/lart_msgs
          key: msgs-${{ steps.cache-keys.outputs.prefix }}-${{ steps.cache-keys.outputs.messages }}

      - name: Build lart_msgs from scratch
        if: steps.messages-cache.outputs.cache-hit != 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          rm -rf build/lart_msgs install/lart_msgs
          colcon build --base-paths src --packages-select lart_msgs --parallel-workers "$(nproc)"

      # Content-based compiler caching keeps unchanged LVGL code reusable even
      # when a message change requires fresh consumer build directories.
      - name: Cache dashboard compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ steps.cache-keys.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.cache-keys.outputs.prefix }}-

      # Keep the message package separate; all consumers share its cache boundary.
      - name: Cache other ROS2 packages
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !build/lart_msgs/**
            install/*
            !install/lart_msgs/**
          key: colcon-${{ steps.cache-keys.outputs.prefix }}-${{ steps.cache-keys.outputs.messages }}-${{ hashFiles('src/**', 'LART_Car_Dashboard_v1/src/ui/**', '!src/lart_msgs/**') }}
          restore-keys: |
            colcon-${{ steps.cache-keys.outputs.prefix }}-${{ steps.cache-keys.outputs.messages }}-

      - name: Build ROS2 workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/lart_msgs/share/lart_msgs/package.bash
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --max-size=500M
          ccache --zero-stats
          colcon build --packages-skip lart_msgs --parallel-workers "$(nproc)" \
            --cmake-args -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats

      - name: Cache dashboard build
        uses: actions/cache@v4
        with:
          path: LART_Car_Dashboard_v1/build/ui-build
          key: ui-${{ steps.cache-keys.outputs.prefix }}-${{ steps.cache-keys.outputs.messages }}-${{ hashFiles('LART_Car_Dashboard_v1/src/ui/**') }}
          restore-keys: |
            ui-${{ steps.cache-keys.outputs.prefix }}-${{ steps.cache-keys.outputs.messages }}-

      - name: Build dashboard UI
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --max-size=500M
          ccache --zero-stats
          cmake -S LART_Car_Dashboard_v1/src/ui -B LART_Car_Dashboard_v1/build/ui-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build LART_Car_Dashboard_v1/build/ui-build --parallel "$(nproc)"
          ccache --show-stats

      - name: Package artifact
        run: tar czf lart-dashboard-arm64.tar.gz install LART_Car_Dashboard_v1/build/ui-build

      - name: Get short commit SHA
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ github.sha }}
          name: "ARM64 build ${{ steps.version.outputs.short_sha }}"
          files: lart-dashboard-arm64.tar.gz

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-arm64
          name: "Latest ARM64 build"
          files: lart-dashboard-arm64.tar.gz
