name: Release

# Self-contained Raspberry Pi bundle: extract on a Pi with ROS 2 Jazzy and run
# `bash scripts/run_runtime.sh`. No simulator; that is built from source on dev PCs.
# The Pi's install/-only update path (pull_arm64_build.sh) stays in build-arm64.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout frozen external ROS interfaces
        run: git submodule update --init src/lart_msgs

      - name: Set up ROS2 build
        uses: ./.github/actions/setup-arm64

      - name: Install runtime dependencies
        run: |
          sudo apt-get install -y ros-jazzy-rosbag2-storage-mcap libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxkbcommon-x11-0 fonts-dejavu-core
          python3 -m pip install --break-system-packages -r requirements-runtime.txt pytest PyYAML

      - name: Build runtime workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --packages-up-to data_station_runtime input_handler led_controller --parallel-workers 2

      - name: Test runtime contracts and DBC reload
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q src/data_station_runtime/test src/lart_bringup/test/test_trigger_state.py src/lart_bringup/test/test_bag_recorder.py
          python3 -m data_station_runtime.app --demo --screenshot /tmp/dashboard.png

      - name: Package bundle
        run: |
          name="data-station-arm64"
          mkdir -p "$name/scripts"
          cp -r install dbc_signals requirements-runtime.txt "$name/"
          cp scripts/run_runtime.sh scripts/start_runtime.sh "$name/scripts/"
          tar czf "$name.tar.gz" "$name"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Data Station ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: data-station-arm64.tar.gz
