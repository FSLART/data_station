{
  "version": 1,
  "description": "Electric car dashboard test defaults; JSON. Physical units follow each DBC. Drive cycle points are [seconds, fraction of maximum speed]. Applied panel controls and timing are saved under simulators.",
  "ranges": {
    "speed_kmh": [
      0,
      80
    ],
    "pack_voltage": [
      500,
      600
    ],
    "cell_voltage": [
      3.5,
      4.2
    ],
    "lv_voltage": [
      24,
      28
    ],
    "battery_temperature": [
      25,
      40
    ],
    "inverter_temperature": [
      35,
      55
    ],
    "motor_temperature": [
      40,
      70
    ],
    "other_temperature": [
      25,
      45
    ],
    "current": [
      -40,
      180
    ],
    "brake_pressure": [
      0,
      60
    ],
    "tank_pressure": [
      6,
      8
    ],
    "steering_rad": [
      -0.5,
      0.5
    ],
    "soc_percent": [
      70,
      95
    ]
  },
  "drive_cycle": [
    [
      0,
      0
    ],
    [
      3,
      0
    ],
    [
      15,
      0.5
    ],
    [
      30,
      0.5
    ],
    [
      42,
      1
    ],
    [
      55,
      1
    ],
    [
      70,
      0
    ],
    [
      80,
      0
    ]
  ],
  "simulators": {
    "/can_simulator_powertrain": {
      "dbc_file": "powertrain_t26.dbc",
      "signal_controls": {
        "INV2_ERPM_DUTY_VOLTAGE": {
          "INV2_Actual_ERPM": {
            "mode": "fixed",
            "value": 120000.0
          }
        }
      },
      "message_intervals_ms": {},
      "publish_hz": 10.0
    },
    "/can_simulator_data": {
      "dbc_file": "data_t26.dbc",
      "signal_controls": {
        "PDM_LV": {
          "LV_Voltage_mV": {
            "mode": "fixed",
            "value": 24.0
          }
        }
      },
      "message_intervals_ms": {},
      "publish_hz": 10.0
    }
  }
}
